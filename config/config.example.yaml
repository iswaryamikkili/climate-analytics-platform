# API Configuration
api:
  openweather_key: "f539025360dc61df747c69ecce5fb4e7"  # Replace with your actual key
  base_url: "https://api.openweathermap.org/data/2.5"
  
# Cities to track
cities:
  - name: "New York"
    lat: 40.7128
    lon: -74.0060
  - name: "Los Angeles"
    lat: 34.0522
    lon: -118.2437
  - name: "Chicago"
    lat: 41.8781
    lon: -87.6298
  - name: "Houston"
    lat: 29.7604
    lon: -95.3698
  - name: "Phoenix"
    lat: 33.4484
    lon: -112.0740

# Database Configuration
database:
  type: "sqlite"
  sqlite_path: "data/climate_data.db"

# Data collection settings
collection:
  interval_hours: 6
  historical_days: 30
